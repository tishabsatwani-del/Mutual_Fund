<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Two Doors, One Storm — A Behavioural Investing Simulator</title>
<meta name="description" content="A behavioural investing simulator for readers of the book Two Doors, One Storm." />
<meta name="theme-color" content="#03141a" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚪</text></svg>" />
<style>
  :root{
    --bg:#03131a; --bg-2:#05202a;
    --turq:#2fe3c4; --turq-2:#12b9a0; --turq-soft:rgba(47,227,196,.16);
    --ink:#dfeaf8; --blue:#a9cbe8; --muted:#7fa3bd;
    --line:rgba(47,227,196,.22);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    overflow:hidden; position:relative;
  }
  /* ---- ambient aurora: slow, expensive-looking, GPU-cheap ---- */
  .aura{position:fixed;inset:-30%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
  .aura i{position:absolute;display:block;border-radius:50%}
  .aura i:nth-child(1){width:52vmax;height:52vmax;left:-6%;top:-8%;
    background:radial-gradient(circle,rgba(47,227,196,.30),transparent 62%);animation:drift1 22s ease-in-out infinite}
  .aura i:nth-child(2){width:46vmax;height:46vmax;right:-8%;bottom:-10%;
    background:radial-gradient(circle,rgba(58,150,214,.26),transparent 62%);animation:drift2 27s ease-in-out infinite}
  .aura i:nth-child(3){width:34vmax;height:34vmax;left:32%;top:38%;
    background:radial-gradient(circle,rgba(18,185,160,.20),transparent 64%);animation:drift3 19s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6%,5%,0) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-7%,-4%,0) scale(.94)}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(.96)}50%{transform:translate3d(4%,-6%,0) scale(1.1)}}
  body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%)}

  /* ---- the card ---- */
  .card{
    position:relative;z-index:2;width:100%;max-width:400px;text-align:center;
    padding:38px 26px 30px;border-radius:26px;
    background:linear-gradient(180deg,rgba(9,34,44,.86),rgba(5,20,27,.92));
    border:1px solid var(--line);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.03) inset,
               0 0 60px -30px rgba(47,227,196,.55);
    animation:rise .9s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

  /* ---- lock ---- */
  .lockwrap{position:relative;width:78px;height:78px;margin:0 auto 22px}
  .ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(47,227,196,.28);opacity:0}
  .lock{width:78px;height:78px;display:block;overflow:visible;animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .shackle{transform-origin:30px 30px;transition:transform .55s cubic-bezier(.6,-0.28,.36,1.4)}
  .lockbody{filter:drop-shadow(0 6px 18px rgba(47,227,196,.35))}
  .keyhole{transition:opacity .3s ease}

  h1{
    font-size:clamp(21px,5.6vw,26px);font-weight:700;letter-spacing:-.015em;line-height:1.2;
    background:linear-gradient(180deg,#eaf4ff,#9dc4e6);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:10px;
  }
  .sub{font-size:14.5px;line-height:1.55;color:var(--blue);font-weight:400;margin-bottom:26px}
  .hair{height:1px;width:54px;margin:0 auto 24px;
    background:linear-gradient(90deg,transparent,var(--line),transparent)}

  /* ---- input ---- */
  .field{position:relative;margin-bottom:14px}
  input{
    width:100%;padding:16px 16px;border-radius:14px;
    background:rgba(2,14,19,.72);border:1px solid rgba(140,190,215,.20);
    color:var(--ink);font-family:var(--mono);font-size:16px;letter-spacing:.16em;
    text-align:center;outline:none;transition:border-color .25s ease,box-shadow .25s ease,background .25s ease;
  }
  input::placeholder{color:#5d7f96;letter-spacing:.06em;font-family:var(--sans)}
  input:focus{border-color:rgba(47,227,196,.65);background:rgba(3,20,27,.9);
    box-shadow:0 0 0 4px var(--turq-soft),0 0 26px -8px rgba(47,227,196,.6)}

  button{
    width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;
    font-family:var(--sans);font-size:15.5px;font-weight:700;letter-spacing:.02em;color:#02231e;
    background:linear-gradient(180deg,#54f0d3,#16bda2);
    box-shadow:0 14px 34px -14px rgba(47,227,196,.85),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .18s ease,box-shadow .25s ease,opacity .2s ease;
  }
  button:hover{box-shadow:0 18px 44px -14px rgba(47,227,196,1),inset 0 1px 0 rgba(255,255,255,.45)}
  button:active{transform:scale(.985)}
  button[disabled]{opacity:.75;cursor:default}

  .msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.5;color:#ff9b9b;opacity:0;transition:opacity .25s ease}
  .msg.on{opacity:1}
  .foot{margin-top:22px;font-size:11.5px;letter-spacing:.04em;color:#5f829a}

  /* ---- states ---- */
  .shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

  body.unlocking .shackle{transform:translateY(-9px) rotate(-26deg)}
  body.unlocking .keyhole{opacity:0}
  body.unlocking .ring{animation:ping 1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ping{0%{opacity:.9;transform:scale(.82)}70%{opacity:.25}100%{opacity:0;transform:scale(2.3)}}
  body.unlocking .card{border-color:rgba(47,227,196,.55);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9),0 0 90px -20px rgba(47,227,196,.75)}
  body.unlocking input,body.unlocking button{opacity:.35;pointer-events:none;transition:opacity .4s ease}

  body.launching .card{opacity:0;transform:translateY(-8px) scale(.97);
    transition:opacity .5s ease,transform .5s ease}
  body.launching .aura{opacity:0;transition:opacity .6s ease}
  body.launching::after{background:#05070b;transition:background .6s ease}

  body.booting .card,body.booting .aura{opacity:0}

  @media (prefers-reduced-motion:reduce){
    .aura i,.lock{animation:none}
    .card{animation:none}
    .shackle{transition:none}
  }
</style>
</head>

<main class="card" role="main">
  <div class="lockwrap">
    <span class="ring" aria-hidden="true"></span>
    <svg class="lock" viewBox="0 0 60 60" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6ff5db"/><stop offset="1" stop-color="#12b9a0"/>
        </linearGradient>
      </defs>
      <path class="shackle" d="M18 28V21a12 12 0 0 1 24 0v7"
            fill="none" stroke="url(#g1)" stroke-width="4.2" stroke-linecap="round"/>
      <rect class="lockbody" x="12" y="27" width="36" height="26" rx="8"
            fill="url(#g1)" opacity=".95"/>
      <g class="keyhole" fill="#04222c">
        <circle cx="30" cy="37.5" r="3.6"/>
        <rect x="28.4" y="39" width="3.2" height="7.5" rx="1.6"/>
      </g>
    </svg>
  </div>

  <h1>Two Doors, One Storm</h1>
  <p class="sub">This simulator is for readers of the book.<br />Enter your access code.</p>
  <div class="hair"></div>

  <form id="f" autocomplete="off">
    <div class="field">
      <input id="code" type="text" inputmode="text" placeholder="Access code"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             aria-label="Access code" />
    </div>
    <button id="go" type="submit">Unlock</button>
  </form>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  var KEYSTORE = 'tdos.k.v1';
  var body = document.body, card = document.querySelector('.card');
  var form = document.getElementById('f'), input = document.getElementById('code');
  var go = document.getElementById('go'), msg = document.getElementById('msg');

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function toB64(buf){ var a=new Uint8Array(buf), s=''; for (var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
    return btoa(s); }

  var subtle = (window.crypto && (window.crypto.subtle || window.crypto.webkitSubtle)) || null;

  function deriveKey(pw, salt) {
    return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name:'PBKDF2', salt: salt, iterations: P.it, hash:'SHA-256' },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      });
  }
  // Try each wrapped master key. AES-GCM authentication IS the password check —
  // a wrong code simply fails to authenticate. Nothing is stored to compare against.
  function unwrap(pw) {
    var i = 0;
    function attempt() {
      if (i >= P.w.length) return Promise.resolve(null);
      var w = P.w[i++];
      return deriveKey(pw, b64(w.s))
        .then(function (k) { return subtle.decrypt({ name:'AES-GCM', iv: b64(w.i) }, k, b64(w.c)); })
        .then(function (raw) { return raw; })
        .catch(function () { return attempt(); });
    }
    return attempt();
  }
  function openBundle(rawMaster) {
    return subtle.importKey('raw', rawMaster, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return subtle.decrypt({ name:'AES-GCM', iv: b64(P.i) }, k, b64(P.c)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  // document.open() while the gate is still being parsed leaves the gate's own
  // markup appended after the simulator — both end up on screen. Always wait for
  // parsing to finish before replacing the document.
  function replaceDocument(html) {
    var write = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', write);
    else write();
  }
  function launch(html) {
    body.classList.add('unlocking');
    setTimeout(function () { body.classList.add('launching'); }, 620);
    setTimeout(function () { replaceDocument(html); }, 1180);
  }
  function fail(text) {
    msg.textContent = text; msg.classList.add('on');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    go.disabled = false; go.textContent = 'Unlock';
    input.select();
  }

  // A device that has unlocked once never has to ask again.
  function remembered() {
    try { return localStorage.getItem(KEYSTORE); } catch (e) { return null; }
  }
  function remember(rawMaster) {
    try { localStorage.setItem(KEYSTORE, toB64(rawMaster)); } catch (e) {}
  }

  function start() {
    if (!subtle) { body.classList.remove('booting');
      fail('This browser is too old to open the simulator. Please try Chrome or Safari.'); return; }
    var saved = remembered();
    if (saved) {
      openBundle(b64(saved).buffer)
        .then(function (html) { replaceDocument(html); })
        .catch(function () { try { localStorage.removeItem(KEYSTORE); } catch (e) {} body.classList.remove('booting'); });
      return;
    }
    body.classList.remove('booting');
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 500);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = input.value;                     // exact, case-sensitive — no trimming of case
    if (!pw) { fail('Please enter your access code.'); return; }
    pw = pw.replace(/^\s+|\s+$/g, '');        // only strip accidental leading/trailing spaces
    msg.classList.remove('on');
    go.disabled = true; go.textContent = 'Checking…';
    unwrap(pw).then(function (rawMaster) {
      if (!rawMaster) { fail('That code isn’t right. Codes are case-sensitive — check the capital letter.'); return; }
      remember(rawMaster);
      return openBundle(rawMaster).then(launch);
    }).catch(function () {
      fail('Something went wrong. Please reload and try again.');
    });
  });

  start();
})();
